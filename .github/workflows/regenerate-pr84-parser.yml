name: Regenerate PR 84 parser

on:
  push:
    branches: [correctness/75-goto-redirect-tail]
    paths: [.github/workflows/regenerate-pr84-parser.yml]

permissions: {}

jobs:
  parser:
    if: github.repository == 'woodruffw-bot/tree-sitter-cmd'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 41def6ae45874c08b3204bceedf5e719795294c3
          persist-credentials: false

      - name: Install generator
        run: cargo install --locked --version 0.26.11 tree-sitter-cli

      - name: Regenerate parser
        run: tree-sitter generate --js-runtime native

      - name: Store verified parser object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          parser = Path('src/parser.c').read_bytes()
          expected = '2062d4d00d41f3b390d8ac8a73bc8e49e1cb57da353a8135c217bfc0463e30dc'
          if hashlib.sha256(parser).hexdigest() != expected:
              raise RuntimeError('Generated parser differs from the tested file')
          payload = json.dumps({
              'content': base64.b64encode(parser).decode('ascii'),
              'encoding': 'base64',
          }).encode('utf-8')
          request = Request(
              'https://api.github.com/repos/woodruffw-bot/tree-sitter-cmd/git/blobs',
              data=payload,
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urlopen(request, timeout=30) as response:
              result = json.load(response)
          if result['sha'] != 'de87a55b815fb1ae5f268523dc6ca95269358e14':
              raise RuntimeError('Unexpected Git blob SHA')
          print('Verified parser Git object: ' + result['sha'])
          PY
