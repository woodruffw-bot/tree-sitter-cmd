name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Parse & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tree-sitter CLI
        run: cargo install --locked --version 0.26.11 tree-sitter-cli

      - name: Generate parser
        run: tree-sitter generate --js-runtime native

      - name: Run corpus tests
        run: tree-sitter test

      - name: Fuzz corpus edits
        run: tree-sitter fuzz --edits 3 --iterations 5
  generated:
    name: Generated parser up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tree-sitter CLI
        run: cargo install --locked --version 0.26.11 tree-sitter-cli

      - name: Regenerate parser
        run: tree-sitter generate --js-runtime native

      - name: Check committed src/ is in sync with grammar.js
        run: |
          if ! git diff --exit-code -- src/; then
            echo "::error::Committed parser in src/ is stale. Run 'tree-sitter generate' and commit the result."
            exit 1
          fi

  rust:
    name: Rust crate & fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build crate
        run: cargo build --verbose

      - name: Test crate and fixtures
        run: cargo test --verbose

      - name: Validate crate package
        if: runner.os == 'Linux'
        run: cargo package --verbose
