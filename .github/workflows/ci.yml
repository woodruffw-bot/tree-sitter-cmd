name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: C formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18

      - name: Check C formatting
        run: git ls-files -z '*.[ch]' | xargs -0 -r clang-format-18 --dry-run --Werror

  test:
    name: Parse & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tree-sitter CLI
        run: cargo install --locked --version 0.26.11 tree-sitter-cli

      - name: Generate parser
        run: tree-sitter generate --js-runtime native

      - name: Run corpus tests
        run: tree-sitter test

      - name: Fuzz corpus edits
        run: tree-sitter fuzz --edits 3 --iterations 5
  generated:
    name: Generated parser up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tree-sitter CLI
        run: cargo install --locked --version 0.26.11 tree-sitter-cli

      - name: Regenerate parser
        run: tree-sitter generate --js-runtime native

      - name: Check committed src/ is in sync with grammar.js
        run: |
          if ! git diff --exit-code -- src/; then
            echo "::error::Committed parser in src/ is stale. Run 'tree-sitter generate' and commit the result."
            exit 1
          fi

  rust:
    name: Rust crate & fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build crate
        run: cargo build --verbose

      - name: Install Rust checks
        run: rustup component add rustfmt clippy

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Lint Rust code
        run: cargo clippy --all-targets -- -D warnings

      - name: Test crate and fixtures
        run: cargo test --verbose

      - name: Validate crate package
        if: runner.os == 'Linux'
        run: cargo package --verbose
