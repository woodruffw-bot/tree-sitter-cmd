name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Parse & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate parser
        run: npx tree-sitter generate

      - name: Run corpus tests
        run: npx tree-sitter test

      - name: Real-world parse regression
        run: bash test/real-world/check.sh

  generated:
    name: Generated parser up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Regenerate parser
        run: npx tree-sitter generate

      - name: Check committed src/ is in sync with grammar.js
        run: |
          if ! git diff --exit-code -- src/; then
            echo "::error::Committed parser in src/ is stale. Run 'tree-sitter generate' and commit the result."
            exit 1
          fi

  rust:
    name: Rust crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build crate
        run: cargo build --verbose

      - name: Test crate
        run: cargo test --verbose
