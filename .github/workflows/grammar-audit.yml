name: Grammar correctness observations

on:
  push:
    branches: ["audit/grammar-correctness-20261102"]

permissions:
  contents: read

jobs:
  observe:
    name: Native CMD observations
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Observe batch syntax
        shell: python
        run: |
          import json, pathlib, subprocess, tempfile
          cases = json.loads(r'''[["quoted_literal_caret","@echo off\nsetlocal DisableDelayedExpansion\nset \"TS_EQ_LITERAL^=value\"\nset TS_EQ_LITERAL\n"],["quoted_active_equals","@echo off\nsetlocal DisableDelayedExpansion\nset \"TS_EQ_ACTIVE\"tail^=value\"\nset TS_EQ_ACTIVE\n"],["quoted_active_prompt","@echo off\nsetlocal DisableDelayedExpansion\necho reply>input\nset /p \"TS_EQ_ACTIVE\"tail^=prompt\"<input\nset TS_EQ_ACTIVE\n"],["redirected_active_equals","@echo off\nset TS_REDIRECT>nul ^=value\nset TS_REDIRECT\n"],["doubled_caret","@echo off\nset TS_DOUBLE^^=value\nset TS_DOUBLE\n"],["unnamed_prompt","@echo off\nset /p ^=prompt<nul\n"]]''')
          for name, source in cases:
              with tempfile.TemporaryDirectory(prefix='cmd-grammar-audit-') as directory:
                  path = pathlib.Path(directory) / 'case.cmd'
                  path.write_bytes(source.replace('\n', '\r\n').encode('utf-8'))
                  result = subprocess.run(['cmd.exe', '/d', '/c', str(path)], cwd=directory, capture_output=True, timeout=10)
                  print(json.dumps({'case': name, 'status': result.returncode, 'stdout': result.stdout.decode('ascii', errors='backslashreplace'), 'stderr': result.stderr.decode('ascii', errors='backslashreplace')}), flush=True)
          
