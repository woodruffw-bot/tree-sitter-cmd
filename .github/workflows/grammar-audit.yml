name: Grammar correctness observations

on:
  push:
    branches: ["audit/grammar-correctness-20261102"]

permissions:
  contents: read

jobs:
  observe:
    name: Native CMD observations
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Observe batch syntax
        shell: python
        run: |
          import json, pathlib, subprocess, tempfile
          cases = json.loads(r'''[["quoted_leading_space_assignment","@echo off\nsetlocal EnableDelayedExpansion\nset \" TS_AUDIT=value\"\necho spaced:[! TS_AUDIT!]\necho trimmed:[!TS_AUDIT!]\n"],["quoted_leading_space_prompt","@echo off\nsetlocal EnableDelayedExpansion\necho reply>input\nset /p \" TS_PROMPT=\"<input\necho spaced:[! TS_PROMPT!]\necho trimmed:[!TS_PROMPT!]\n"],["quoted_space_only_name","@echo off\nset \" =blank\"\n"],["quoted_tab_name","@echo off\nsetlocal EnableDelayedExpansion\nset \"\tTS_AUDIT=value\"\necho trimmed:[!TS_AUDIT!]\n"],["for_tilde_variable","@echo off\nfor %%~ in (one) do echo [%%~]\n"],["for_modified_star_variable","@echo off\nfor %%* in (one) do echo [%%~n*]\n"],["for_star_reference","@echo off\nfor %%* in (one) do echo %%*\n"]]''')
          for name, source in cases:
              with tempfile.TemporaryDirectory(prefix='cmd-grammar-audit-') as directory:
                  path = pathlib.Path(directory) / 'case.cmd'
                  path.write_bytes(source.replace('\n', '\r\n').encode('utf-8'))
                  result = subprocess.run(['cmd.exe', '/d', '/c', str(path)], cwd=directory, capture_output=True, timeout=10)
                  print(json.dumps({'case': name, 'status': result.returncode, 'stdout': result.stdout.decode('ascii', errors='backslashreplace'), 'stderr': result.stderr.decode('ascii', errors='backslashreplace')}), flush=True)
          
