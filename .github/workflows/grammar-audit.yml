name: Grammar correctness observations

on:
  push:
    branches: ["audit/grammar-correctness-20261102"]

permissions:
  contents: read

jobs:
  observe:
    name: Native CMD observations
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Observe batch syntax
        shell: python
        run: |
          import json, pathlib, subprocess, tempfile
          cases = json.loads(r'''[["rem_operators","@echo off\nrem note & echo REM_AND_RAN\nrem note >redirected\nif exist redirected echo REM_REDIRECT_RAN\necho REM_DONE\n"],["rem_block_close","@echo off\n(\nrem note)\necho AFTER_BLOCK\n"],["rem_pipe","@echo off\nrem note | echo REM_PIPE_RAN\n"],["rem_expansion","@echo off\nset TS_AUDIT=expanded\nrem %TS_AUDIT% & echo EXPANSION_TAIL\n"]]''')
          for name, source in cases:
              with tempfile.TemporaryDirectory(prefix='cmd-grammar-audit-') as directory:
                  path = pathlib.Path(directory) / 'case.cmd'
                  path.write_bytes(source.replace('\n', '\r\n').encode('utf-8'))
                  result = subprocess.run(['cmd.exe', '/d', '/c', str(path)], cwd=directory, capture_output=True, timeout=10)
                  print(json.dumps({'case': name, 'status': result.returncode, 'stdout': result.stdout.decode('ascii', errors='backslashreplace'), 'stderr': result.stderr.decode('ascii', errors='backslashreplace')}), flush=True)
          
