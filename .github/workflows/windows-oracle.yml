name: Windows cmd oracle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run observational cases
        run: cargo test --test windows_oracle -- --include-ignored --nocapture
