[package]
name = "tree-sitter-cmd"
description = "Tree-sitter grammar for Windows cmd.exe / batch scripts"
version = "0.1.0"
authors = ["tree-sitter-cmd contributors"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "cmd"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/woodruffw-trough/tree-sitter-cmd"
edition = "2021"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "queries/*",
  "src/parser.c",
  "src/scanner.c",
  "src/node-types.json",
  "src/tree_sitter/parser.h",
  "src/tree_sitter/alloc.h",
  "/GRAMMAR_DESIGN.md",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"

[lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
