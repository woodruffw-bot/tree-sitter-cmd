[package]
name = "tree-sitter-cmd"
description = "Tree-sitter grammar for Windows cmd.exe / batch scripts"
version = "0.1.0"
authors = ["tree-sitter-cmd contributors"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "cmd"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/woodruffw-bot/tree-sitter-cmd"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
